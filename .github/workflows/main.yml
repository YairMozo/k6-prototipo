name: k6-test

on:
  workflow_dispatch:   # Permite ejecutar manualmente
  push:                # Corre automáticamente en cada push
    branches: [ "main" ]

jobs:
  run-k6-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar k6
        run: |
          sudo apt update
          sudo apt install -y gnupg ca-certificates
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6.gpg \
            --recv-keys 379CE192D401AB61
          echo "deb [signed-by=/usr/share/keyrings/k6.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt update
          sudo apt install -y k6

      - name: Ejecutar prueba de carga con k6
        run: k6 run test-carga.js

      - name: Guardar reporte de salida
        uses: actions/upload-artifact@v4
        with:
          name: reporte-k6
          path: ./ # Puedes limitar a un archivo específico si deseas
